<!doctype html>
<html lang="en-us">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
    <meta content="text/html; charset=utf-8" http-equiv="Content-Type">

    <title>kisakcod webport</title>

    <style>
        @font-face {
            font-family: "Conduit ITC";
            src: url("assets/conduit-itc-regular.otf") format("opentype");
            font-weight: 400;
            font-style: normal;
            font-display: swap;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            background: #000;
            width: 100%;
            height: 100%;
            min-width: 100%;
            min-height: 100%;
            overflow: hidden;
            font-family: "Conduit ITC", sans-serif;
            font-size: 18px;
        }

        body {
            position: fixed;
            inset: 0;
        }

        #canvas {
            position: fixed;
            inset: 0;

            display: block;

            width: 100%;
            height: 100%;
            width: 100vw;
            height: 100vh;
            width: 100dvw;
            height: 100dvh;

            max-width: none;
            max-height: none;

            margin: 0;
            padding: 0;
            border: 0;

            outline: 0;

            object-fit: fill;

            cursor: none;

            touch-action: none;

            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
        }

        #installer-panel {
            position: absolute;
            inset: 0;
            background: rgba(16, 11, 20, .96);
            color: #d8d8d8;
            z-index: 3;
            overflow: auto;
            padding: 36px 40px 56px;
            box-sizing: border-box;
            text-align: center;
        }

        #installer-panel h1 {
            margin: 0 0 12px;
            font-size: 32px;
            color: #fff;
            letter-spacing: .06em;
        }

        #installer-panel p.hint {
            color: #9aa;
            max-width: 52em;
            font-size: 18px;
            line-height: 1.45;
            margin: 0 auto 24px;
        }

        #installer-panel button {
            background: #6ec26e;
            color: #183318;
            border: none;
            padding: 9px 13px;
            margin: 6px;
            font-size: 18px;
            border-radius: 2px;
            cursor: pointer;
            font-family: inherit;
        }

        #installer-panel button:disabled {
            opacity: .4;
            cursor: default;
        }

        #installer-panel button.danger {
            background: #3a1c1c;
            color: #fcc;
        }

        #installer-panel button.secondary {
            background: #333;
            color: #ddd;
        }

        #installer-panel .row {
            display: flex;
            justify-content: center;
            align-items: baseline;
            flex-wrap: wrap;
            gap: 8px;
            margin: 12px auto;
        }

        #install-options {
            max-width: 900px;
            margin: 0 auto;
        }

        #install-options[hidden] {
            display: none;
        }

        #install-copy-size {
            color: #aaa;
            font-size: 16px;
            margin: 12px auto;
        }

        #progress-wrap {
            max-width: 760px;
            margin: 22px auto 0;
        }

        #progress-bar {
            width: 100%;
            height: 22px;
            background: #222;
            border: 1px solid #444;
            box-sizing: border-box;
            overflow: hidden;
        }

        #progress-fill {
            width: 0%;
            height: 100%;
            background: #6ec26e;
            transition: width .08s linear;
        }

        #progress-text {
            margin-top: 8px;
            color: #aaa;
            font-size: 16px;
            min-height: 20px;
        }

        #download-status {
            margin-top: 14px;
            color: #ddd;
            font-size: 18px;
            min-height: 22px;
        }

        #download-detail {
            margin-top: 5px;
            color: #888;
            font-size: 14px;
            min-height: 18px;
        }

        #status {
            color: #ddd;
            margin-top: 10px;
            min-height: 22px;
        }

        #install-log {
            white-space: pre-wrap;
            font-size: 14px;
            color: #9a9;
            margin: 16px auto 0;
            max-width: 68em;
            max-height: 260px;
            overflow: auto;
            text-align: left;
        }

        .small {
            color: #777;
            font-size: 14px;
        }

        #fullscreen-button {
            display: none;
            position: absolute;
            right: 20px;
            top: 20px;
            z-index: 5;
            background: #6ec26e;
            color: #183318;
            border: none;
            border-radius: 2px;
            padding: 8px;
            cursor: pointer;
            font-family: inherit;
            font-size: 18px;
        }

        body.game-running:not(.is-fullscreen) #fullscreen-button {
            display: block;
        }

        body.game-running #installer-panel {
            display: none !important;
        }
    </style>
</head>

<body>

    <div id="installer-panel">

        <h1>KisakCOD</h1>

        <p class="hint">
            Install the game files from the split ZIP archive.
            The archive is processed piece-by-piece and extracted directly
            into browser storage.
        </p>

        <div class="row">

            <button id="install-button" type="button">
                Install Game
            </button>

            <button id="play-button" type="button" disabled>
                Play
            </button>

            <button id="wipe-data-button" type="button" class="danger">
                Wipe data
            </button>

        </div>

        <div id="install-options" hidden>

            <div class="row">

                <label>
                    <input id="include-audio" type="checkbox" checked>
                    Audio
                </label>

                <label>
                    <input id="include-video" type="checkbox">
                    Video
                </label>

            </div>

            <div id="install-copy-size"></div>

            <div id="progress-wrap">

                <div id="progress-bar">
                    <div id="progress-fill"></div>
                </div>

                <div id="progress-text">
                    Waiting...
                </div>

                <div id="download-status"></div>

                <div id="download-detail"></div>

            </div>

        </div>

        <div id="status"></div>

        <div id="install-log"></div>

        <div class="small">
            Game data is stored locally using Origin Private File System.
        </div>

    </div>

    <canvas
        id="canvas"
        tabindex="-1"
        width="1280"
        height="720">
    </canvas>

    <button id="fullscreen-button" type="button">
        Fullscreen
    </button>

    <template id="module-script-template">
        <script async src="kisakcod-sp.js"></script>
    </template>

    <script>
        "use strict";

        /* ============================================================
           UI Elements Cache
           ============================================================ */
        const canvas = document.getElementById("canvas");
        const fullscreenButton = document.getElementById("fullscreen-button");
        const installerPanel = document.getElementById("installer-panel");
        const installButton = document.getElementById("install-button");
        const playButton = document.getElementById("play-button");
        const wipeDataButton = document.getElementById("wipe-data-button");
        const installOptions = document.getElementById("install-options");
        const includeAudio = document.getElementById("include-audio");
        const includeVideo = document.getElementById("include-video");
        const progressFill = document.getElementById("progress-fill");
        const progressText = document.getElementById("progress-text");
        const downloadStatus = document.getElementById("download-status");
        const downloadDetail = document.getElementById("download-detail");
        const statusLabel = document.getElementById("status");
        const installLog = document.getElementById("install-log");
        const moduleScriptTemplate = document.getElementById("module-script-template");

        /* ============================================================
           Configuration & Core State
           ============================================================ */
        const OPFS_MARKER_FILE = ".installation_complete";
        const STITCHED_ZIP_NAME = "cod4-modern-warfare.zip";
        let isProcessing = false;

        const TOTAL_PARTS = 128;
        const BASE_PATH = "game-files/"; 

        /* ============================================================
           Initialization & Verification
           ============================================================ */
        async function init() {
            bindEvents();
            await checkExistingInstallation();
            await injectUnzipEngine();
        }

        function appendLog(msg) {
            const time = new Date().toLocaleTimeString();
            installLog.textContent += "[" + time + "] " + msg + "\n";
            installLog.scrollTop = installLog.scrollHeight;
        }

        async function injectUnzipEngine() {
            if (window.fflate) return;
            appendLog("Loading client-side stream decompression layers...");
            return new Promise((resolve) => {
                const script = document.createElement("script");
                script.src = "https://unpkg.com/fflate@0.8.2/umd/index.js";
                script.onload = () => {
                    appendLog("Streaming decomp engine ready for asset parsing.");
                    resolve();
                };
                document.head.appendChild(script);
            });
        }

        async function checkExistingInstallation() {
            try {
                const root = await navigator.storage.getDirectory();
                await root.getFileHandle(OPFS_MARKER_FILE, { create: false });
                
                appendLog("Verified active operational assets inside browser isolation storage.");
                playButton.disabled = false;
                installButton.textContent = "Reinstall Assets";
            } catch (e) {
                appendLog("Sandbox storage clear. Deployment requires file download extraction configuration.");
                playButton.disabled = true;
            }
        }

        /* ============================================================
           Storage Operations (OPFS Handling)
           ============================================================ */
        async function wipeLocalData() {
            if (!confirm("Caution: This will purge all downloaded engine data from browser isolation. Proceed?")) {
                return;
            }

            try {
                const root = await navigator.storage.getDirectory();
                for await (const name of root.keys()) {
                    await root.removeEntry(name, { recursive: true });
                }
                appendLog("OPFS Virtual Root directory successfully reset.");
                playButton.disabled = true;
                installButton.textContent = "Install Game";
                setProgressBar(0, "System Cleaned");
            } catch (err) {
                appendLog("Error purging directory context: " + err.message);
            }
        }

        /* ============================================================
           Stitching & Unzipping Core Subsystem Pipeline
           ============================================================ */
        function setProgressBar(percentage, statusText) {
            progressFill.style.width = percentage + "%";
            progressText.textContent = statusText;
        }

        async function startInstallationPipeline() {
            if (isProcessing) return;
            isProcessing = true;

            installButton.disabled = true;
            wipeDataButton.disabled = true;
            installOptions.hidden = false;

            appendLog("Connecting to game data target servers for " + TOTAL_PARTS + " split fragments...");

            try {
                const root = await navigator.storage.getDirectory();
                
                // 1. STITCHING PHASE
                const masterZipHandle = await root.getFileHandle(STITCHED_ZIP_NAME, { create: true });
                const zipWritableStream = await masterZipHandle.createWritable();
                let overallBytesRead = 0;

                for (let i = 1; i <= TOTAL_PARTS; i++) {
                    const partString = String(i).padStart(3, '0');
                    const fileName = "cod4-modern-warfare.zip.part" + partString;
                    const targetUrl = BASE_PATH + fileName;

                    downloadStatus.textContent = "Downloading slice container " + i + " of " + TOTAL_PARTS + "...";
                    
                    const res = await fetch(targetUrl);
                    if (!res.ok) {
                        throw new Error("Failed to load " + fileName + " (HTTP " + res.status + "). Verify file mapping structures.");
                    }

                    const contentLength = res.headers.get("Content-Length");
                    if (contentLength && parseInt(contentLength) < 500) {
                        throw new Error("Execution halted on " + fileName + ": Resource size indicates an un-expanded Git LFS pointer script.");
                    }

                    const reader = res.body.getReader();
                    while (true) {
                        const { done, value } = await reader.read();
                        if (done) break;

                        await zipWritableStream.write(value);
                        overallBytesRead += value.length;
                    }

                    if (i % 10 === 0 || i === TOTAL_PARTS) {
                        appendLog("Stitched package data index stream: " + fileName);
                    }

                    let currentPct = Math.floor((i / TOTAL_PARTS) * 50);
                    downloadDetail.textContent = (overallBytesRead / 1024 / 1024).toFixed(1) + " MB compiled";
                    setProgressBar(currentPct, "Compiling aggregate game package structures: " + (currentPct * 2) + "%");
                }

                await zipWritableStream.close();
                appendLog("Stitch operations completed. Initiating asset block file decompression...");

                // 2. EXTRACTION PHASE
                downloadStatus.textContent = "Parsing virtual file layouts into sandboxed sectors...";
                const masterFile = await masterZipHandle.getFile();
                const arrayBuffer = await masterFile.arrayBuffer();
                const zipUint8Array = new Uint8Array(arrayBuffer);

                const unzipped = fflate.unzipSync(zipUint8Array);
                const filePaths = Object.keys(unzipped);
                
                appendLog("Identified " + filePaths.length + " deployment structures inside archive matrix. Processing file creation...");

                for (let j = 0; j < filePaths.length; j++) {
                    const path = filePaths[j];
                    const data = unzipped[path];

                    if (path.endsWith('/') || data.length === 0) continue; 

                    const pathSegments = path.split('/');
                    let currentDir = root;

                    for (let s = 0; s < pathSegments.length - 1; s++) {
                        currentDir = await currentDir.getDirectoryHandle(pathSegments[s], { create: true });
                    }

                    const targetFileName = pathSegments[pathSegments.length - 1];
                    const outHandle = await currentDir.getFileHandle(targetFileName, { create: true });
                    const outWriter = await outHandle.createWritable();
                    await outWriter.write(data);
                    await outWriter.close();

                    if (j % 20 === 0) {
                        let unpackPct = 50 + Math.floor((j / filePaths.length) * 50);
                        setProgressBar(unpackPct, "Extracting component parameters to file mapping nodes: " + unpackPct + "%");
                    }
                }

                await root.removeEntry(STITCHED_ZIP_NAME);

                const markerHandle = await root.getFileHandle(OPFS_MARKER_FILE, { create: true });
                const writer = await markerHandle.createWritable();
                await writer.write(new TextEncoder().encode("VERIFIED_OK"));
                await writer.close();

                setProgressBar(100, "Installation Complete!");
                downloadStatus.textContent = "Extraction operation finished. Game engines operational.";
                downloadDetail.textContent = "";
                playButton.disabled = false;

            } catch (err) {
                appendLog("Fatal pipeline termination error: " + err.message);
                downloadStatus.textContent = "System extraction process aborted.";
                setProgressBar(0, "Error Exception Trace");
            } finally {
                isProcessing = false;
                installButton.disabled = false;
                wipeDataButton.disabled = false;
            }
        }

        /* ============================================================
           Application Engine Controls
           ============================================================ */
        function executeEngineEnvironment() {
            appendLog("Injecting runtime assembly hook modules...");
            document.body.classList.add("game-running");

            window.Module = {
                canvas: canvas,
                print: (text) => appendLog("[Engine Core] " + text),
                printErr: (text) => console.error("[Engine Exception] " + text),
                onRuntimeInitialized: () => {
                    appendLog("WebAssembly active compilation complete. Engine loop initialization active.");
                }
            };

            const dynamicScriptNode = moduleScriptTemplate.content.cloneNode(true);
            document.body.appendChild(dynamicScriptNode);
        }

        function handleScreenViewConfig() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().then(() => {
                    document.body.classList.add("is-fullscreen");
                }).catch((e) => {
                    appendLog("Fullscreen request denied: " + e.message);
                });
            } else {
                document.exitFullscreen();
                document.body.classList.remove("is-fullscreen");
            }
        }

        function bindEvents() {
            installButton.addEventListener("click", startInstallationPipeline);
            playButton.addEventListener("click", executeEngineEnvironment);
            wipeDataButton.addEventListener("click", wipeLocalData);
            fullscreenButton.addEventListener("click", handleScreenViewConfig);

            document.addEventListener("fullscreenchange", () => {
                if (!document.fullscreenElement) {
                    document.body.classList.remove("is-fullscreen");
                }
            });
        }

        init();
    </script>
</body>

</html>
